name: SEO 자동 갱신
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 seo-auto.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "SEO 자동 갱신 (제목·설명·사이트맵)" && git push)
