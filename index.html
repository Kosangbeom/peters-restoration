 ["어떤 소재까지 가능한가요?","원목, 대리석, 가죽, 패브릭, 금속, 우레탄 도장, 유리 등 다양한 소재를 다룹니다. 목록에 없는 소재도 사진을 보내주시면 가능 여부를 안내해 드립니다."],
 ["어느 지역까지 방문 가능한가요?","서울·경기·인천을 포함해 전국 출장 상담이 가능합니다."],
];

function BeforeAfter({className=""}){
  const [pos,setPos]=useState(50);
  const ref=useRef(null);
  const drag=(clientX)=>{
    const r=ref.current.getBoundingClientRect();
    let p=((clientX-r.left)/r.width)*100;
    setPos(Math.max(0,Math.min(100,p)));
  };
  return (
    <div ref={ref} className={"relative w-full aspect-video rounded-xl overflow-hidden select-none cursor-ew-resize shadow-2xl border border-[#3a352c] "+className}
      onMouseMove={e=>{ if(e.buttons===1) drag(e.clientX); }}
      onTouchMove={e=>drag(e.touches[0].clientX)}
      onClick={e=>drag(e.clientX)}>
      <div className="absolute inset-0" style={{background:"linear-gradient(135deg,#d8c39a,#c9a769 45%,#8f6f3f)"}}>
        <div className="absolute bottom-4 right-4 text-xs tracking-widest text-[#161412] serif font-medium">AFTER · 복원 후</div>
      </div>
      <div className="absolute inset-0 overflow-hidden" style={{clipPath:`inset(0 ${100-pos}% 0 0)`}}>
        <div className="absolute inset-0" style={{background:"linear-gradient(135deg,#4a4038,#6b5c4a 40%,#8a7458)"}}></div>
        <div className="absolute bottom-4 left-4 text-xs tracking-widest text-[#eee7d8]/70 serif">BEFORE · 복원 전</div>
      </div>
      <div className="absolute top-0 bottom-0 w-[2px] bg-[var(--gold2)]" style={{left:`${pos}%`}}>
        <div className="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-9 h-9 rounded-full bg-[var(--gold2)] flex items-center justify-center shadow-lg">
          <Icon name="move-horizontal" size={18} className="text-[#161412]"/>
        </div>
      </div>
    </div>
  );
}

function ImageStrip({large}){
  const swatches=[["#4a3826","#8a6a45"],["#3a3835","#6b6560"],["#5a4a3a","#a68a63"],["#6b5c4a","#c9a769"],["#2f2e2b","#5c574e"]];
  return (
    <div className={"grid grid-cols-5 "+(large?"gap-1.5 md:gap-3":"gap-2 md:gap-3")+" w-full"}>
      {swatches.map((s,i)=><Swatch key={i} c1={s[0]} c2={s[1]} className={large?"aspect-[3/4] md:aspect-[4/5]":"aspect-square"}/>)}
    </div>
  );
}

function HeroSlideshow(){
  const slides=[
    {img:HERO_IMG_1},
    {img:HERO_IMG_2},
    {img:HERO_IMG_3},
  ];
  const [i,setI]=useState(0);
  useEffect(()=>{ const t=setInterval(()=>setI(v=>(v+1)%slides.length),4500); return ()=>clearInterval(t); },[]);
  return (
    <div className="absolute inset-0">
      {slides.map((s,idx)=>(
        <div key={idx} className="absolute inset-0 transition-opacity duration-1000 bg-cover bg-center" style={{opacity: idx===i?1:0, backgroundImage: s.img?`url(${s.img})`:`linear-gradient(135deg, ${s.c1}, ${s.c2})`}}></div>
      ))}
      <div className="absolute bottom-6 right-6 md:bottom-8 md:right-8 flex gap-2 z-10">
        {slides.map((_,idx)=>(
          <button key={idx} onClick={()=>setI(idx)} className={"w-2 h-2 rounded-full transition-colors "+(idx===i?"bg-[var(--gold2)]":"bg-white/40")}></button>
        ))}
      </div>
    </div>
  );
}

function Faq({q,a,open,onClick}){
  return (
    <div className="border-b border-[#3a352c]">
      <button onClick={onClick} className="w-full flex items-center justify-between gap-4 py-5 text-left">
        <span className="font-medium">{q}</span>
        <Icon name={open?"minus":"plus"} size={18} className="gold shrink-0"/>
      </button>
      {open && <p className="pb-5 text-sm text-[var(--muted)] leading-relaxed">{a}</p>}
    </div>
  );
}

              <p className="font-bold serif mb-1">{c.t}</p>
              <p className="text-xs text-[var(--muted)]">{c.tag}</p>
            </div>
          ))}
        </div>
        <div className="text-center mt-12">
          <a href="case.html" className="gold text-sm font-semibold hover:underline">복원 사례 전체 보기 →</a>
        </div>
      </div>
    </section>

    {/* Services */}
    <section id="services" className="py-20 px-5 md:px-8">
      <div className="max-w-7xl mx-auto">
        <div className="text-center mb-14">
          <p className="uppercase tracking-[0.3em] text-xs gold mb-3">SERVICES</p>
          <h2 className="serif text-3xl md:text-4xl font-bold mb-4">전문 복원 서비스</h2>
          <p className="text-[var(--muted)]">다양한 표면과 소재, 피터의복원의 손길로 본래의 가치를 더합니다.</p>
        </div>
        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
          {services.map(s=>(
            <div key={s.title} className="group bg-[var(--panel)] p-7 rounded-2xl border border-[#3a352c] hover:border-[var(--gold)] hover:-translate-y-1 transition-all">
              <div className="w-12 h-12 rounded-full bg-gold/15 flex items-center justify-center mb-5 group-hover:bg-gold/25 transition-colors"><Icon name={s.icon} className="gold"/></div>
              <p className="text-xs gold mb-2">{s.tag}</p>
              <h3 className="serif font-bold mb-2">{s.title}</h3>
              <p className="text-[var(--muted)] text-sm leading-relaxed">{s.desc}</p>
            </div>
          ))}
        </div>
        <div className="text-center mt-12">
          <a href="service.html" className="gold text-sm font-semibold hover:underline">전체 복원 작업 유형 보기 →</a>
        </div>
      </div>
    </section>

    {/* Showcase */}
    <section className="py-20 px-5 md:px-8 bg-[var(--bg2)]">
      <div className="max-w-4xl mx-auto text-center">
        <p className="uppercase tracking-[0.3em] text-xs gold mb-3">BEFORE / AFTER</p>
        <h2 className="serif text-3xl md:text-4xl font-bold mb-4">전 · 후 비교 쇼케이스</h2>
        <p className="text-[var(--muted)] mb-10">슬라이더를 드래그해 복원 전과 후를 직접 비교해보세요.</p>
        <BeforeAfter/>
      </div>
    </section>

    {/* FAQ */}
    <section id="faq" className="py-20 px-5 md:px-8">
      <div className="max-w-3xl mx-auto">
        <div className="text-center mb-10">
          <p className="uppercase tracking-[0.3em] text-xs gold mb-3">FAQ</p>
          <h2 className="serif text-3xl md:text-4xl font-bold mb-4">자주 묻는 질문</h2>
          <p className="text-[var(--muted)]">상담하면서 가장 많이 듣는 질문을 모았습니다.</p>
        </div>
        <div>
          {faqs.map((f,i)=>(
            <Faq key={i} q={f[0]} a={f[1]} open={faqOpen===i} onClick={()=>setFaqOpen(faqOpen===i?-1:i)}/>
          ))}
        </div>
      </div>
    </section>

    <div className="max-w-5xl mx-auto px-5 md:px-8 py-10"><ImageStrip/></div>

    {/* Brand statement */}
    <section className="py-20 px-5 md:px-8 bg-[var(--bg2)]">
      <div className="max-w-2xl mx-auto text-center">
        <p className="uppercase tracking-[0.3em] text-xs gold mb-3">피터의복원</p>
        <h2 className="serif text-3xl md:text-4xl font-bold mb-6">바꾸지 않고도,<br/>처음의 가치로</h2>
        <p className="text-[var(--muted)] leading-relaxed">가구의 모서리 하나, 소파의 얼룩 하나, 스피커 도장면에 남은 흠집 하나.<br/>손상은 대개 아주 작은 자리에서 시작합니다.<br/><br/>비슷한 색으로 메꾸는 것이 아니라 그 자리에 맞는 색과 질감을 만들고,<br/>결과 무늬까지 이어 그려 경계를 지웁니다.<br/>티 나지 않는 복원, 그것이 피터의복원의 기준입니다.</p>
      </div>
    </section>

    <ContactCTA/>
    <SiteFooter/>
    <MobileCTA/>
  </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
