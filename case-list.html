function ContactCTA(){

        <p className="text-[var(--muted)] mb-10">가구 · 명품 · 이사 전 원상복구 · 악기 · 인테리어 마감 · 상업 시설물 등<br/>사진 몇 장만 보내주시면 바로 확인해 드립니다.<br/><br/>작업과 강의 중일 때는 전화를 못받을 수 있습니다.<br/>문자로 사진과 지역을 남겨 주시면 확인 즉시 연락드립니다.</p>
        <div className="flex flex-col sm:flex-row gap-4 justify-center">
          <a href={TEL_HREF} className="bg-gold text-[#161412] font-semibold px-7 py-4 rounded-full hover:bg-[var(--gold2)] transition-colors flex items-center justify-center gap-2">
            <Icon name="phone" size={18}/><span className="text-left"><span className="block">전화 상담</span><span className="block text-xs font-normal opacity-80">24시간 365일 언제든 연락 주세요</span></span>
          </a>
          <a href={SMS_HREF} className="border border-[#4a4438] px-7 py-4 rounded-full hover:border-[var(--gold)] hover:text-[var(--gold2)] transition-colors flex items-center justify-center gap-2">
            <Icon name="message-square-text" size={18}/><span className="text-left"><span className="block">문자 상담</span><span className="block text-xs font-normal opacity-70">손상된 곳 사진을 보내주시면 안내드립니다</span></span>

function Header({current,menuOpen,setMenuOpen}){
  const nav=[["portfolio","복원 사례"],["services","복원 서비스"],["education","복원 교육"],["faq","FAQ"],["contact","복원 문의"]];
  const hrefFor=(id)=>{
    if(id==="portfolio") return "case.html";
    if(id==="services") return "service.html";
    if(id==="education") return "education.html";
    if(id==="faq") return current==="home" ? "#faq" : "index.html#faq";
    if(id==="contact") return current==="home" ? "#contact" : "index.html#contact";
    return "#"+id;
  };
  return (
    <header className="fixed top-0 inset-x-0 z-50 backdrop-blur bg-[var(--bg)]/85 border-b border-[#3a352c]" style={{paddingTop:"env(safe-area-inset-top,0px)"}}>
      <div className="max-w-7xl mx-auto px-5 md:px-8 h-16 flex items-center justify-between">
        <a href="index.html" className="flex flex-col leading-none">
          <span className="text-[9px] tracking-[0.35em] text-[var(--muted)] mb-1">아티스틱 복원 전문</span>
          <span className="serif text-xl font-bold tracking-wide gold">피터의 복원</span>
        </a>
        <nav className="hidden lg:flex gap-8 text-sm text-[var(--muted)]">
          {nav.map(([id,label])=> <a key={id} href={hrefFor(id)} className="hover:text-[var(--gold2)] transition-colors">{label}</a>)}
        </nav>
        <div className="flex items-center gap-3">
          <a href={SMS_HREF} className="hidden sm:inline-block bg-gold text-[#161412] text-sm font-semibold px-5 py-2.5 rounded-full hover:bg-[var(--gold2)] transition-colors">복원 문의</a>
          <button className="lg:hidden text-[var(--beige)]" onClick={()=>setMenuOpen(!menuOpen)}><Icon name={menuOpen?"x":"menu"}/></button>
        </div>
      </div>
      {menuOpen && <div className="lg:hidden px-5 pb-4 flex flex-col gap-3 border-t border-[#3a352c] pt-3">
        {nav.map(([id,label])=> <a key={id} href={hrefFor(id)} onClick={()=>setMenuOpen(false)} className="text-[var(--muted)] hover:text-[var(--gold2)]">{label}</a>)}
      </div>}
    </header>
  );
}

    </a>
  );
}

          <p className="uppercase tracking-[0.3em] text-xs gold mb-3">PORTFOLIO</p>
          <h1 className="serif text-3xl md:text-5xl font-bold mb-4">{group?group.title:"복원 사례 목록"}</h1>
          <p className="text-[var(--muted)] max-w-xl mb-12">{group?<>{group.tag} · 현장 기록 {group.items.length}건<br/>사진을 누르면 시공 과정을 자세히 보실 수 있습니다.</>:"복원 항목별 현장 기록을 모았습니다."}</p>
          {groups.map(([k,g])=>(
            <div key={k} className="mb-14">
              {!group && <h2 className="serif text-xl font-bold gold mb-6"><a href={"case-list.html?item="+k} className="hover:underline">{g.title}</a></h2>}
              <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-8">
                {g.items.map((c,i)=><ListCard key={i} c={c}/>)}
              </div>
            </div>
          ))}
          <a href="case.html" className="inline-block mt-2 text-sm gold font-semibold hover:underline">← 전체 복원 사례 보기</a>
        </div>
      </section>
      <ContactCTA/>
      <SiteFooter/>
      <MobileCTA/>
    </div>
  );
}
function App(){
  const [menuOpen,setMenuOpen]=useState(false);
  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); });
  return (
    <div className="min-h-screen pb-20 md:pb-0">
      <Header current="case" menuOpen={menuOpen} setMenuOpen={setMenuOpen}/>
      <ListPage/>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
