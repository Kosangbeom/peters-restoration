function BeforeAfter({className=""}){
  const [pos,setPos]=useState(50);
  const ref=useRef(null);
  const drag=(clientX)=>{
    const r=ref.current.getBoundingClientRect();
    let p=((clientX-r.left)/r.width)*100;
    setPos(Math.max(0,Math.min(100,p)));
  };
  return (
    <div ref={ref} className={"relative w-full aspect-video rounded-xl overflow-hidden select-none cursor-ew-resize shadow-2xl border border-[#3a352c] "+className}
      onMouseMove={e=>{ if(e.buttons===1) drag(e.clientX); }}
      onTouchMove={e=>drag(e.touches[0].clientX)}
      onClick={e=>drag(e.clientX)}>
      <div className="absolute inset-0" style={{background:"linear-gradient(135deg,#d8c39a,#c9a769 45%,#8f6f3f)"}}>
        <div className="absolute bottom-4 right-4 text-xs tracking-widest text-[#161412] serif font-medium">AFTER · 복원 후</div>
      </div>
      <div className="absolute inset-0 overflow-hidden" style={{clipPath:`inset(0 ${100-pos}% 0 0)`}}>
        <div className="absolute inset-0" style={{background:"linear-gradient(135deg,#4a4038,#6b5c4a 40%,#8a7458)"}}></div>
        <div className="absolute bottom-4 left-4 text-xs tracking-widest text-[#eee7d8]/70 serif">BEFORE · 복원 전</div>
      </div>
      <div className="absolute top-0 bottom-0 w-[2px] bg-[var(--gold2)]" style={{left:`${pos}%`}}>
        <div className="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-9 h-9 rounded-full bg-[var(--gold2)] flex items-center justify-center shadow-lg">
          <Icon name="move-horizontal" size={18} className="text-[#161412]"/>
        </div>
      </div>
    </div>
  );
}

function ImageStrip({large}){
  const swatches=[["#4a3826","#8a6a45"],["#3a3835","#6b6560"],["#5a4a3a","#a68a63"],["#6b5c4a","#c9a769"],["#2f2e2b","#5c574e"]];
  return (
    <div className={"grid grid-cols-5 "+(large?"gap-1.5 md:gap-3":"gap-2 md:gap-3")+" w-full"}>
      {swatches.map((s,i)=><Swatch key={i} c1={s[0]} c2={s[1]} className={large?"aspect-[3/4] md:aspect-[4/5]":"aspect-square"}/>)}
    </div>
  );
}

function Faq({q,a,open,onClick}){
  return (
    <div className="border-b border-[#3a352c]">
      <button onClick={onClick} className="w-full flex items-center justify-between gap-4 py-5 text-left">
        <span className="font-medium">{q}</span>
        <Icon name={open?"minus":"plus"} size={18} className="gold shrink-0"/>
      </button>
      {open && <p className="pb-5 text-sm text-[var(--muted)] leading-relaxed">{a}</p>}
    </div>
  );
}

                  <div key={i} className="group">
                    <Swatch c1={c.c1} c2={c.c2} className="aspect-[4/3] mb-4 group-hover:opacity-90 transition-opacity"/>
                    <p className="font-bold serif mb-1">{c.t}</p>

function Header({current,menuOpen,setMenuOpen}){
  const nav=[["portfolio","복원 사례"],["services","복원 서비스"],["education","복원 교육"],["faq","FAQ"],["contact","복원 문의"]];
  const hrefFor=(id)=>{
    if(id==="portfolio") return "case.html";
    if(id==="services") return "service.html";
    if(id==="education") return "education.html";
    if(id==="faq") return current==="home" ? "#faq" : "index.html#faq";
    if(id==="contact") return current==="home" ? "#contact" : "index.html#contact";
    return "#"+id;
  };
  return (
    <header className="fixed top-0 inset-x-0 z-50 backdrop-blur bg-[var(--bg)]/85 border-b border-[#3a352c]" style={{paddingTop:"env(safe-area-inset-top,0px)"}}>
      <div className="max-w-7xl mx-auto px-5 md:px-8 h-16 flex items-center justify-between">
        <a href="index.html" className="flex flex-col leading-none">
          <span className="text-[9px] tracking-[0.35em] text-[var(--muted)] mb-1">아티스틱 복원 전문</span>
          <span className="serif text-xl font-bold tracking-wide gold">피터의 복원</span>
        </a>
        <nav className="hidden lg:flex gap-8 text-sm text-[var(--muted)]">
          {nav.map(([id,label])=> <a key={id} href={hrefFor(id)} className="hover:text-[var(--gold2)] transition-colors">{label}</a>)}
        </nav>
        <div className="flex items-center gap-3">
          <a href={SMS_HREF} className="hidden sm:inline-block bg-gold text-[#161412] text-sm font-semibold px-5 py-2.5 rounded-full hover:bg-[var(--gold2)] transition-colors">복원 문의</a>
          <button className="lg:hidden text-[var(--beige)]" onClick={()=>setMenuOpen(!menuOpen)}><Icon name={menuOpen?"x":"menu"}/></button>
        </div>
      </div>
      {menuOpen && <div className="lg:hidden px-5 pb-4 flex flex-col gap-3 border-t border-[#3a352c] pt-3">
        {nav.map(([id,label])=> <a key={id} href={hrefFor(id)} onClick={()=>setMenuOpen(false)} className="text-[var(--muted)] hover:text-[var(--gold2)]">{label}</a>)}
      </div>}
    </header>
  );
}

function App(){
  const [menuOpen,setMenuOpen]=useState(false);
  useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); });
  return (
    <div className="min-h-screen pb-20 md:pb-0">
      <Header current="service" menuOpen={menuOpen} setMenuOpen={setMenuOpen}/>
      <ServicePage/>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
